<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>홀로그램 카드</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 40%, #2a2d3a, #15161d 70%);
    }

    /* 기울지 않는 바깥 틀: 마우스 좌표는 여기 기준으로 계산 */
    .scene {
      width: 300px;
      aspect-ratio: 864 / 1208;      /* 카드 이미지 비율 */
      cursor: grab;
      user-select: none;
      touch-action: none;
    }
    .scene.dragging { cursor: grabbing; }

    /* 기울어지는 부분 (JS가 변수와 transform을 매 프레임 갱신) */
    .container {
      --px: 0.5;  --py: 0.5;   /* 빛 위치 (0~1) */
      --mx: 50%;  --my: 50%;   /* 빛 위치 (%) */
      --o: 0.4;                /* 포일 세기 */
      --g1: 0; --g2: 0; --g3: 0;   /* 반짝이 세트별 세기 */
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      will-change: transform;
    }

    /* 드래그로 돌아가는 부분 */
    .flipper {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
    }

    .face {
      position: absolute;
      inset: 0;
      border-radius: 4.5% / 3.2%;
      overflow: hidden;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.55);
      isolation: isolate;
    }
    .back { transform: rotateY(180deg); }

    .card {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
    }
    .front .card { background-image: url(front.webp); }
    .back  .card { background-image: url(back.webp); }

    /* ── 앞면 효과 레이어 ───────────────────────────
       포일·반짝이는 --foil 마스크(배경·테두리)에만 인쇄되고
       패턴은 카드에 고정 → 기울기에 따라 '색과 밝기'만 바뀜 */
    .holo, .sparkle, .glare {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    /* 1) 무지개 포일 */
    .holo {
      background-image: repeating-linear-gradient(120deg,
        hsl(350, 100%, 80%) 0%,
        hsl(40, 100%, 78%)  3.5%,
        hsl(90, 90%, 78%)   7%,
        hsl(170, 95%, 78%)  10.5%,
        hsl(215, 100%, 82%) 14%,
        hsl(275, 95%, 84%)  17.5%,
        hsl(350, 100%, 80%) 21%);
      background-size: 300% 300%;
      background-position: calc(var(--px) * 100%) calc(var(--py) * 100%);
      mix-blend-mode: multiply;
      opacity: calc(var(--o) * 0.75);
      -webkit-mask: var(--foil) center / 100% 100% no-repeat;
              mask: var(--foil) center / 100% 100% no-repeat;
    }

    /* 2) 반짝이: 위치는 고정. 3세트가 각자 다른 방향으로 기울 때 빛남
          (실제 포일 알갱이가 각도마다 다르게 반사되는 원리) */
    .sparkle {
      background-size: 200px 200px;
      -webkit-mask: var(--foil) center / 100% 100% no-repeat;
              mask: var(--foil) center / 100% 100% no-repeat;
    }
    .s1 { background-image: url(sparkle1.png); opacity: var(--g1); }
    .s2 { background-image: url(sparkle2.png); opacity: var(--g2); }
    .s3 { background-image: url(sparkle3.png); opacity: var(--g3); }

    /* 3) 코팅 광택 */
    .glare {
      background-image: radial-gradient(farthest-corner circle at var(--mx) var(--my),
        rgba(255, 255, 255, 0.55) 0%,
        rgba(255, 255, 255, 0.15) 30%,
        rgba(0, 0, 0, 0.12) 100%);
      mix-blend-mode: soft-light;
      opacity: var(--o);
    }

<body>

  <div class="scene">
    <div class="container">
      <div class="flipper">
        <div class="face front">
          <div class="card"></div>
          <div class="holo"></div>
          <div class="sparkle s1"></div>
          <div class="sparkle s2"></div>
          <div class="sparkle s3"></div>
          <div class="glare"></div>
        </div>
        <!-- 뒷면: 효과 없음 -->
        <div class="face back">
          <div class="card"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    var scene = document.querySelector('.scene')
    var container = document.querySelector('.container')
    var flipper = document.querySelector('.flipper')

    var MAX_TILT = 20      // 최대 기울기(도)
    var SPEED = 0.6        // 1px 드래그당 회전 각도
    var THRESHOLD = 50     // 이만큼 이상 돌리고 놓으면 반대 면으로
    var SMOOTH = 0.12      // 따라오는 부드러움
    var IDLE_O = 0.45      // 마우스가 없을 때 기본 포일 세기

    var target = { rx: 0, ry: 0, px: 0.5, py: 0.5, o: IDLE_O }
    var cur    = { rx: 0, ry: 0, px: 0.5, py: 0.5, o: IDLE_O }
    var hovering = false
    var dragging = false, startX = 0, startAngle = 0, angle = 0

    // 마우스가 없을 때: 카드가 아주 살짝 흔들리며 포일이 은은하게 살아있음
    function idle(t) {
      var px = 0.5 + 0.22 * Math.sin(t * 0.0006)
      var py = 0.5 + 0.15 * Math.sin(t * 0.00045 + 1.3)
      target.px = px
      target.py = py
      target.rx = (py - 0.5) * 2 * MAX_TILT * 0.25
      target.ry = (0.5 - px) * 2 * MAX_TILT * 0.25
      target.o = IDLE_O
    }

    // 반짝이 세트별 세기: 카드가 기운 방향(각도)과 세트의 '빛나는 방향'이 가까울수록 밝게
    var SET_DIR = [0, 2.094, 4.189]   // 0°, 120°, 240°
    function sparkleWeights(px, py) {
      var dx = px - 0.5, dy = py - 0.5
      var mag = Math.min(Math.hypot(dx, dy) / 0.5, 1)
      var th = Math.atan2(dy, dx)
      return SET_DIR.map(function (d) {
        var c = Math.max(0, Math.cos(th - d))
        return Math.pow(c, 3) * (0.25 + mag * 0.75)
      })
    }

    function frame(t) {
      if (!hovering && !dragging) idle(t)
      for (var k in cur) cur[k] += (target[k] - cur[k]) * SMOOTH

      container.style.transform =
        'perspective(900px) rotateX(' + cur.rx + 'deg) rotateY(' + cur.ry + 'deg)'
      var s = container.style
      s.setProperty('--px', cur.px)
      s.setProperty('--py', cur.py)
      s.setProperty('--mx', (cur.px * 100) + '%')
      s.setProperty('--my', (cur.py * 100) + '%')
      s.setProperty('--o', cur.o)
      var w = sparkleWeights(cur.px, cur.py)
      s.setProperty('--g1', w[0])
      s.setProperty('--g2', w[1])
      s.setProperty('--g3', w[2])
      requestAnimationFrame(frame)
    }
    requestAnimationFrame(frame)

    // 마우스 위치 → 기울기 + 빛 위치
    function aim(e) {
      var r = scene.getBoundingClientRect()
      var px = Math.min(Math.max((e.clientX - r.left) / r.width, 0), 1)
      var py = Math.min(Math.max((e.clientY - r.top) / r.height, 0), 1)
      target.px = px
      target.py = py
      target.rx = (py - 0.5) * 2 * MAX_TILT
      target.ry = dragging ? 0 : (0.5 - px) * 2 * MAX_TILT
      var dist = Math.min(Math.hypot(px - 0.5, py - 0.5) / 0.7, 1)
      target.o = IDLE_O + dist * (1 - IDLE_O)
    }

    // 드래그로 뒤집기
    function setAngle(deg, animate) {
      flipper.style.transition = animate ? 'transform 0.55s cubic-bezier(.2,.8,.3,1)' : 'none'
      flipper.style.transform = 'rotateY(' + deg + 'deg)'
    }

    scene.addEventListener('pointerenter', function () { hovering = true })
    scene.addEventListener('pointerdown', function (e) {
      dragging = true
      startX = e.clientX
      startAngle = angle
      scene.classList.add('dragging')
      scene.setPointerCapture(e.pointerId)
      aim(e)
    })
    scene.addEventListener('pointermove', function (e) {
      hovering = true
      if (dragging) {
        angle = startAngle + (e.clientX - startX) * SPEED
        setAngle(angle, false)
      }
      aim(e)
    })
    function endDrag(e) {
      if (!dragging) return
      dragging = false
      scene.classList.remove('dragging')
      var delta = angle - startAngle
      var snap = Math.round(angle / 180) * 180
      if (snap === startAngle && Math.abs(delta) > THRESHOLD) {
        snap = startAngle + Math.sign(delta) * 180
      }
      angle = snap
      setAngle(angle, true)
      var r = scene.getBoundingClientRect()
      hovering = e.clientX >= r.left && e.clientX <= r.right &&
                 e.clientY >= r.top && e.clientY <= r.bottom
      if (hovering) aim(e)
    }
    scene.addEventListener('pointerup', endDrag)
    scene.addEventListener('pointercancel', endDrag)
    scene.addEventListener('pointerleave', function () { if (!dragging) hovering = false })
  </script>
