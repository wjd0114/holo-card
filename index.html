<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>홀로그램 카드</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 40%, #2a2d3a, #15161d 70%);
    }

    /* 기울지 않는 바깥 틀: 마우스 좌표는 여기 기준으로 계산 */
    .scene {
      width: 300px;
      aspect-ratio: 63 / 88;         /* 실물 카드 비율 63×88mm */
      cursor: grab;
      user-select: none;
      touch-action: none;
    }
    .scene.dragging { cursor: grabbing; }

    /* 기울어지는 부분 (JS가 변수와 transform을 매 프레임 갱신) */
    .container {
      --px: 0.5;  --py: 0.5;   /* 빛 위치 (0~1) */
      --mx: 50%;  --my: 50%;   /* 빛 위치 (%) */
      --o: 0.4;                /* 포일 세기 */
      --g1: 0; --g2: 0; --g3: 0;   /* 반짝이 세트별 세기 */
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      will-change: transform;
    }

    /* 드래그로 돌아가는 부분 */
    .flipper {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
    }

    .face {
      position: absolute;
      inset: 0;
      border-radius: 4% / 2.86%;     /* 카드 이미지 모서리보다 살짝 크게 → 흰 모서리가 안 보임 */
      overflow: hidden;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.55);
      isolation: isolate;
    }
    .back { transform: rotateY(180deg); }

    .card {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
    }
    .front .card { background-image: url(front.webp); }
    .back  .card { background-image: url(back.webp); }

    /* ════ 1층: 배경 (무지개 포일 + 반짝이) ════
       패턴은 카드에 고정 → 기울기에 따라 '색과 밝기'만 바뀜 */
    .holo, .sparkle, .glare {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    /* 1) 무지개 포일 */
    .holo {
      background-image: repeating-linear-gradient(120deg,
        hsl(350, 100%, 80%) 0%,
        hsl(40, 100%, 78%)  3.5%,
        hsl(90, 90%, 78%)   7%,
        hsl(170, 95%, 78%)  10.5%,
        hsl(215, 100%, 82%) 14%,
        hsl(275, 95%, 84%)  17.5%,
        hsl(350, 100%, 80%) 21%);
      background-size: 300% 300%;
      background-position: calc(var(--px) * 100%) calc(var(--py) * 100%);
      mix-blend-mode: multiply;            /* 흰 부분에 무지개색이 '인쇄'된 느낌 */
      opacity: calc(var(--o) * 0.4);
    }
    /* 1-b) 같은 무지개를 소프트라이트로 한 겹 더 → 그림 부분도 탁하지 않게 무지개빛 */
    .holo2 {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(120deg,
        hsl(350, 100%, 62%) 0%,
        hsl(40, 100%, 60%)  3.5%,
        hsl(90, 90%, 58%)   7%,
        hsl(170, 95%, 58%)  10.5%,
        hsl(215, 100%, 64%) 14%,
        hsl(275, 95%, 66%)  17.5%,
        hsl(350, 100%, 62%) 21%);
      background-size: 300% 300%;
      background-position: calc(var(--px) * 100%) calc(var(--py) * 100%);
      mix-blend-mode: soft-light;
      opacity: calc(var(--o) * 0.7);
    }

    /* 2) 반짝이: 위치는 고정. 3세트가 각자 다른 방향으로 기울 때 빛남
          (실제 포일 알갱이가 각도마다 다르게 반사되는 원리) */
    .sparkle {
      background-size: 200px 200px;
    }
    .s1 { background-image: url(sparkle1.png); opacity: var(--g1); }
    .s2 { background-image: url(sparkle2.png); opacity: var(--g2); }
    .s3 { background-image: url(sparkle3.png); opacity: var(--g3); }

    /* 3) 코팅 광택 */
    .glare {
      background-image: radial-gradient(farthest-corner circle at var(--mx) var(--my),
        rgba(255, 255, 255, 0.55) 0%,
        rgba(255, 255, 255, 0.15) 30%,
        rgba(0, 0, 0, 0.12) 100%);
      mix-blend-mode: soft-light;
      opacity: var(--o);
    }


    /* ════ 2층: 캐릭터 누끼 (배경 포일 위에 덮여서 캐릭터는 포일 대신 자기 효과만) ════ */
    .char {
      position: absolute;
      inset: 0;
      background: url(char.webp) center / 100% 100% no-repeat;
      pointer-events: none;
    }
    /* 캐릭터 전용 효과: 기울기에 따라 대각선 빛줄기가 캐릭터 위만 훑고 지나가는 광택 */
    .char-sheen {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(115deg,
        transparent 30%,
        rgba(255, 255, 255, 0.0) 38%,
        rgba(255, 255, 255, 0.75) 47%,
        rgba(190, 235, 255, 0.55) 50%,
        rgba(255, 210, 245, 0.45) 53%,
        rgba(255, 255, 255, 0.0) 62%,
        transparent 70%);
      background-size: 260% 260%;
      background-position: calc(var(--px) * 100%) calc(var(--py) * 100%);
      mix-blend-mode: soft-light;
      opacity: calc(0.35 + var(--o) * 0.65);
      -webkit-mask: var(--charmask) center / 100% 100% no-repeat;
              mask: var(--charmask) center / 100% 100% no-repeat;
    }
    /* 캐릭터 윤곽 은은한 림라이트 */
    .char-rim {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(farthest-corner circle at var(--mx) var(--my),
        rgba(255, 255, 255, 0.35) 0%, rgba(255, 255, 255, 0) 40%);
      mix-blend-mode: overlay;
      opacity: var(--o);
      -webkit-mask: var(--charmask) center / 100% 100% no-repeat;
              mask: var(--charmask) center / 100% 100% no-repeat;
    }

    /* ════ 3층: 대사 (메탈릭 무지개 포일 글씨) ════ */
    .quote {
      position: absolute;
      inset: 0;
      background: url(quote.webp) center / 100% 100% no-repeat;
      pointer-events: none;
    }
    .quote-foil {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(100deg,
        hsl(330, 100%, 84%) 0%,
        hsl(45, 100%, 80%)  2.5%,
        hsl(150, 90%, 80%)  5%,
        hsl(195, 100%, 82%) 7.5%,
        hsl(265, 100%, 86%) 10%,
        hsl(330, 100%, 84%) 12.5%);
      background-size: 400% 400%;
      /* 배경 포일과 반대 방향·더 빠르게 → 글씨만 따로 번쩍이는 금속 느낌 */
      background-position: calc((1 - var(--px)) * 220%) calc((1 - var(--py)) * 120%);
      mix-blend-mode: multiply;
      opacity: calc(0.6 + var(--o) * 0.4);
      -webkit-mask: var(--quotemask) center / 100% 100% no-repeat;
              mask: var(--quotemask) center / 100% 100% no-repeat;
    }
    /* 대사 외곽선: 기울기에 따라 색이 흐르는 그라디언트 테두리 */
    .quote-edge {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(120deg,
        #0a7887 0%, #2d3796 20%, #962887 40%,
        #0a7887 60%, #2d3796 80%, #962887 100%);
      background-size: 300% 300%;
      background-position: calc(var(--px) * 100%) calc(var(--py) * 100%);
      opacity: 0.9;
      -webkit-mask: var(--edgemask) center / 100% 100% no-repeat;
              mask: var(--edgemask) center / 100% 100% no-repeat;
    }
    .quote-glint {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(115deg, transparent 44%, rgba(255,255,255,0.95) 50%, transparent 56%);
      background-size: 300% 300%;
      background-position: calc(var(--px) * 100%) calc(var(--py) * 100%);
      mix-blend-mode: screen;
      opacity: var(--o);
      -webkit-mask: var(--quotemask) center / 100% 100% no-repeat;
              mask: var(--quotemask) center / 100% 100% no-repeat;
    }

    }
  </style>
</head>
<body>

  <div class="scene">
    <div class="container">
      <div class="flipper">
        <div class="face front">
          <div class="card"></div>
          <div class="holo"></div>
          <div class="holo2"></div>
          <div class="sparkle s1"></div>
          <div class="sparkle s2"></div>
          <div class="sparkle s3"></div>
          <div class="char"></div>
          <div class="char-sheen"></div>
          <div class="char-rim"></div>
          <div class="quote"></div>
          <div class="quote-edge"></div>
          <div class="quote-foil"></div>
          <div class="quote-glint"></div>
          <div class="glare"></div>
        </div>
        <!-- 뒷면: 효과 없음 -->
        <div class="face back">
          <div class="card"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    var scene = document.querySelector('.scene')
    var container = document.querySelector('.container')
    var flipper = document.querySelector('.flipper')

    var MAX_TILT = 20      // 최대 기울기(도)
    var SPEED = 0.6        // 1px 드래그당 회전 각도
    var THRESHOLD = 50     // 이만큼 이상 돌리고 놓으면 반대 면으로
    var SMOOTH = 0.12      // 따라오는 부드러움
    var IDLE_O = 0.45      // 마우스가 없을 때 기본 포일 세기

    var target = { rx: 0, ry: 0, px: 0.5, py: 0.5, o: IDLE_O }
    var cur    = { rx: 0, ry: 0, px: 0.5, py: 0.5, o: IDLE_O }
    var hovering = false
    var dragging = false, startX = 0, startAngle = 0, angle = 0

    // 마우스가 없을 때: 카드가 아주 살짝 흔들리며 포일이 은은하게 살아있음
    function idle(t) {
      var px = 0.5 + 0.22 * Math.sin(t * 0.0006)
      var py = 0.5 + 0.15 * Math.sin(t * 0.00045 + 1.3)
      target.px = px
      target.py = py
      target.rx = (py - 0.5) * 2 * MAX_TILT * 0.25
      target.ry = (0.5 - px) * 2 * MAX_TILT * 0.25
      target.o = IDLE_O
    }

    // 반짝이 세트별 세기: 카드가 기운 방향(각도)과 세트의 '빛나는 방향'이 가까울수록 밝게
    var SET_DIR = [0, 2.094, 4.189]   // 0°, 120°, 240°
    function sparkleWeights(px, py) {
      var dx = px - 0.5, dy = py - 0.5
      var mag = Math.min(Math.hypot(dx, dy) / 0.5, 1)
      var th = Math.atan2(dy, dx)
      return SET_DIR.map(function (d) {
        var c = Math.max(0, Math.cos(th - d))
        return Math.pow(c, 3) * (0.25 + mag * 0.75)
      })
    }

    function frame(t) {
      if (!hovering && !dragging) idle(t)
      for (var k in cur) cur[k] += (target[k] - cur[k]) * SMOOTH

      container.style.transform =
        'perspective(900px) rotateX(' + cur.rx + 'deg) rotateY(' + cur.ry + 'deg)'
      var s = container.style
      s.setProperty('--px', cur.px)
      s.setProperty('--py', cur.py)
      s.setProperty('--mx', (cur.px * 100) + '%')
      s.setProperty('--my', (cur.py * 100) + '%')
      s.setProperty('--o', cur.o)
      var w = sparkleWeights(cur.px, cur.py)
      s.setProperty('--g1', w[0])
      s.setProperty('--g2', w[1])
      s.setProperty('--g3', w[2])
      requestAnimationFrame(frame)
    }
    requestAnimationFrame(frame)

    // 마우스 위치 → 기울기 + 빛 위치
    function aim(e) {
      var r = scene.getBoundingClientRect()
      var px = Math.min(Math.max((e.clientX - r.left) / r.width, 0), 1)
      var py = Math.min(Math.max((e.clientY - r.top) / r.height, 0), 1)
      target.px = px
      target.py = py
      target.rx = (py - 0.5) * 2 * MAX_TILT
      target.ry = dragging ? 0 : (0.5 - px) * 2 * MAX_TILT
      var dist = Math.min(Math.hypot(px - 0.5, py - 0.5) / 0.7, 1)
      target.o = IDLE_O + dist * (1 - IDLE_O)
    }

    // 드래그로 뒤집기
    function setAngle(deg, animate) {
      flipper.style.transition = animate ? 'transform 0.55s cubic-bezier(.2,.8,.3,1)' : 'none'
      flipper.style.transform = 'rotateY(' + deg + 'deg)'
    }

    scene.addEventListener('pointerenter', function () { hovering = true })
    scene.addEventListener('pointerdown', function (e) {
      dragging = true
      startX = e.clientX
      startAngle = angle
      scene.classList.add('dragging')
      scene.setPointerCapture(e.pointerId)
      aim(e)
    })
    scene.addEventListener('pointermove', function (e) {
      hovering = true
      if (dragging) {
        angle = startAngle + (e.clientX - startX) * SPEED
        setAngle(angle, false)
      }
      aim(e)
    })
    function endDrag(e) {
      if (!dragging) return
      dragging = false
      scene.classList.remove('dragging')
      var delta = angle - startAngle
      var snap = Math.round(angle / 180) * 180
      if (snap === startAngle && Math.abs(delta) > THRESHOLD) {
        snap = startAngle + Math.sign(delta) * 180
      }
      angle = snap
      setAngle(angle, true)
      var r = scene.getBoundingClientRect()
      hovering = e.clientX >= r.left && e.clientX <= r.right &&
                 e.clientY >= r.top && e.clientY <= r.bottom
      if (hovering) aim(e)
    }
    scene.addEventListener('pointerup', endDrag)
    scene.addEventListener('pointercancel', endDrag)
    scene.addEventListener('pointerleave', function () { if (!dragging) hovering = false })
  </script>

</body>
</html>
